name: Feature Request
description: 建议新的过滤入口、规则或改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 当前遇到了什么问题？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 希望扩展如何处理？请说明适用页面和预期结果。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他做法或可能的误伤场景？

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该建议不要求上传账号数据、增加遥测或执行远程代码
          required: true
